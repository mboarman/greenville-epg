name: Update Greenville EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate EPG
        run: python3 update_epg.py

      - name: Commit EPG files
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          git diff --cached --quiet || git commit -m "Update EPG"
          git push
